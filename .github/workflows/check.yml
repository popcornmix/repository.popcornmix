name: Check
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Catches a zip added to docs/ without the indexes and the landing page
      # being regenerated, which Kodi would only report as a checksum mismatch.
      - run: tools/make_repo.py build --check
